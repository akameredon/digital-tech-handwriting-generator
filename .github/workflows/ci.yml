name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run curriculum tests
        run: python tests/test_curriculum.py

      - name: Run preprocessor tests
        run: python tests/test_preprocessor.py

      - name: Check imports
        run: |
          python -c "from curriculum.nerdc_schemes import get_lesson; print(get_lesson('SS2', 'Second Term', 2))"
          python -c "from curriculum.prompt_engine import build_prompt; print('prompt engine ok')"
