[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-tech-lesson-generator"
version = "1.1.2"
description = "NERDC 2025 Digital Technologies Lesson Note Generator for Nigerian SS1–SS3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "akameredon" }
]
dependencies = [
    "opencv-python-headless>=4.8.0,<5.0",
    "Pillow>=10.0.0,<12.0",
    "numpy>=1.24.0,<3.0",
    "fonttools>=4.42.0,<5.0",
    "reportlab>=4.0.0,<5.0",
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.22.0,<1.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0,<9.0"]

[project.scripts]
dt-notes = "scripts.generate_note:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["curriculum*", "ingestion*", "model*", "renderer*", "scripts*", "samples*"]
namespaces = true

[tool.setuptools.package-data]
samples = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
